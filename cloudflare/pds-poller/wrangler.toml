name = "pds-poller"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# * * * * * — minute poll: checks the repo rev, and on a change, diffs the nine watched
# collections and deploys on change.
# 0 * * * * — hourly belt-and-braces rebuild in case an on-demand build failed
# (e.g. PDS unreachable at build time) and no new record will re-trigger it.
[triggers]
crons = ["* * * * *", "0 * * * *"]

[[durable_objects.bindings]]
name = "POLLER"
class_name = "PdsPoller"

# SQLite-backed class — required for Durable Objects on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PdsPoller"]

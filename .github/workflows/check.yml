name: Typecheck

# Nothing else in the pipeline checks types: `astro build` strips them with
# esbuild, tsx runs the scripts, and wrangler bundles the Worker. This job is
# the only thing that runs `tsc`.
#
# It reports, it does not gate. Cloudflare Workers Builds starts on push in
# parallel and never reads the Actions result, so a failure here is a red X on
# the commit, not a blocked deploy. Blocking would mean branch protection on a
# PR flow; gating inside the build is not an option, because a build cannot tell
# a code push from a pds-poller content rebuild (same commit, and Cloudflare
# exposes no trigger reason), so it would gate every content deploy too.
#
# Every branch, not just main: a push is the only event that can change the code.
# The poller's hook never touches GitHub, so content deploys are never checked —
# which is right, as they cannot introduce a type error.
on:
  push:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # astro check syncs content first, which runs the loaders against the PDS
      # and the other upstream APIs. Run it as its own step so a network failure
      # upstream reads as a sync failure rather than a phantom type error.
      - name: Sync content collections
        run: npx astro sync

      - name: Check types
        run: npm run check

name: Poll PDS

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-pds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for new PDS records
        id: check
        run: |
          DID="did:plc:j5ksi3y4tdtbp7vpsxsfyask"
          HOST="bsky.social"
          CHANGED=false
          CHANGED_TYPES=""

          pretty_name() {
            case "$1" in
              app.bsky.feed.post)                  echo "post" ;;
              app.beaconbits.beacon)               echo "beacon" ;;
              com.barryfrost.checkin)              echo "checkin" ;;
              social.popfeed.feed.review)          echo "review" ;;
              buzz.bookhive.book)                  echo "book" ;;
              site.standard.document)              echo "document" ;;
              site.standard.graph.subscription)    echo "subscription" ;;
              social.grain.gallery)                echo "gallery" ;;
              social.grain.gallery.item)           echo "gallery item" ;;
              social.grain.photo)                  echo "photo" ;;
              *)                                   echo "$1" ;;
            esac
          }

          for COLLECTION in app.bsky.feed.post app.beaconbits.beacon com.barryfrost.checkin social.popfeed.feed.review buzz.bookhive.book site.standard.document site.standard.graph.subscription social.grain.gallery social.grain.gallery.item social.grain.photo; do
            LATEST=$(curl -sf "https://${HOST}/xrpc/com.atproto.repo.listRecords?repo=${DID}&collection=${COLLECTION}&limit=1" | jq -r '.records[0].cid // "none"')
            CACHED=$(jq -r ".\"${COLLECTION}\" // \"\"" .github/last-seen-cids.json)

            if [ "$LATEST" != "$CACHED" ] && [ "$LATEST" != "none" ]; then
              CHANGED=true
              PRETTY=$(pretty_name "$COLLECTION")
              CHANGED_TYPES="${CHANGED_TYPES:+$CHANGED_TYPES, }$PRETTY"
              # Update the cached CID
              jq --arg col "$COLLECTION" --arg cid "$LATEST" '.[$col] = $cid' .github/last-seen-cids.json > tmp.json && mv tmp.json .github/last-seen-cids.json
            fi
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "changed_types=$CHANGED_TYPES" >> "$GITHUB_OUTPUT"

      - name: Commit updated CIDs
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-seen-cids.json
          git commit -m "chore: new PDS record (${{ steps.check.outputs.changed_types }})"
          git push

      - name: Trigger rebuild
        if: steps.check.outputs.changed == 'true'
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=pds-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [pds-update]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache downloaded images
        uses: actions/cache@v4
        with:
          path: public/images
          key: images-${{ runner.os }}
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name barryfrost-v7
      - name: Notify Pushover on success
        if: success()
        run: |
          curl -s -f \
            --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER }}" \
            --form-string "title=barryfrost.com deployed" \
            --form-string "message=Commit ${GITHUB_SHA::7} via ${{ github.event_name }}" \
            --form-string "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "url_title=View workflow run" \
            https://api.pushover.net/1/messages.json
      - name: Notify Pushover on failure
        if: failure()
        run: |
          curl -s -f \
            --form-string "token=${{ secrets.PUSHOVER_TOKEN }}" \
            --form-string "user=${{ secrets.PUSHOVER_USER }}" \
            --form-string "title=barryfrost.com deploy failed" \
            --form-string "message=Commit ${GITHUB_SHA::7} via ${{ github.event_name }}" \
            --form-string "priority=1" \
            --form-string "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "url_title=View workflow run" \
            https://api.pushover.net/1/messages.json
